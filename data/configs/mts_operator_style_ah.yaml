tokenizer:
  representation: nef-fsq
  checkpoint: outputs/nef_fsq_soma_packed_40x9_ah/best.pt
  freeze: true
transport:
  checkpoint: outputs/mts_transport/seed_ah/best.pt
  freeze: true
style_encoder:
  kind: reference
  dim: 256
  depth: 4
  heads: 8
  graph_depth: 1
  temporal_mode: bidirectional
  output_dim: 256
  num_styles: null
operator:
  name: birth_death
  hidden_dim: 256
  coordinate_dim: 32
  max_rate: 2.0
  strength: 1.0
data:
  fsq_window_index: data/processed/seed_soma_pruned_v4_ah
  required_data_schema_version: 3
  token_store: data/processed/seed_soma_pruned_v4_ah_tokens
  frames: 64
  pairs:
    mode: same_style
    stage: train
    reference_frames: 64
    held_out_styles: []
  style_split:
    val_fraction: 0.2
    unseen_fraction: 0.2
masking:
  random_coordinate: 0.1
  stream: 0.15
  temporal_span: 0.2
  spatiotemporal_block: 0.25
  full_generation: 0.3
  coordinate_ratio: 0.3
  stream_ratio: 0.3
  span_ratio: 0.5
  block_frames: 16
  block_coordinates: 8
training:
  epochs: 100
  lr: 0.0002
  weight_decay: 0.0
  grad_clip_norm: 1.0
  precision: fp32
  seed: 3407
  log_every_steps: 50
  steps_per_epoch: null
  max_steps: null
  output_dir: outputs/mts_operator/style/seed_ah
  content_weight: 0.0
  strength_range:
  - 0.5
  - 1.5
sampling:
  strategy: clip_uniform
  target_frames: 64
  samples_per_epoch: 100000
  seed: 3407
  mirror_probability: 0.5
loader:
  batch_size: 32
  num_workers: 0
  pin_memory: auto
  drop_last_train: true
  max_open_shards: 32
  prefetch_memory_limit_mb: 512
