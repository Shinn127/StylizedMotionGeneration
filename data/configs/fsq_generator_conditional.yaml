data:
  token_database: data/processed/100style_pruned/flat_fsq_40x9
  trajectory_database: data/processed/100style_pruned/flat_fsq_40x9_trajectory

model:
  coordinate_embedding_dim: 16
  d_model: 256
  num_layers: 6
  num_query_heads: 8
  num_kv_heads: 4
  ff_dim: 768
  dropout: 0.1
  context_frames: 64
  rope_theta: 10000.0
  qk_norm: true
  norm_eps: 0.00001

training:
  batch_size: 512
  epochs: 100
  lr: 0.0003
  weight_decay: 0.01
  grad_clip_norm: 1.0
  seed: 3407
  deterministic: false
  num_workers: 8
  device: auto
  output_dir: outputs/generator_conditional_flat_fsq_40x9
