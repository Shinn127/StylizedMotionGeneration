representation:
  family: flat_fsq
  variant: flat
  config:
    motion_dim: 230
    code_dim: 128
    width: 512
    num_coordinates: 40
    num_levels: 9
    fsq_scale:
    fsq_preserve_symmetry: false
    fsq_noise_dropout: 0.0

data:
  feature_database: data/processed/100style_pruned/feature_database
  split_train: train
  split_val: val
  split_test: test
  window_size: 64

training:
  batch_size: 512
  epochs: 100
  lr: 0.0002
  weight_decay: 0.0
  precision: fp32
  seed: 3407
  deterministic: false
  grad_clip_norm: 1.0
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  output_dir: outputs/flat_fsq_40x9
  delta_weight: 3.0
  root_pos_weight: 0.1
  root_rot_weight: 0.1
  joint_weight: 0.5
  contact_weight: 0.1
  foot_slide_weight: 0.1
  foot_height_weight: 0.1
  contact_temperature: 10.0

evaluation:
  metrics_interval: 100
  root_dt: 0.016666666666666666
