# Architecture/data reference for the base transport.  The executable recipe for the
# 2,000-step run is mts_revision2_transport_pilot.yaml (same architecture, its own
# resolved output directory); this file keeps the old output path as a template only.
tokenizer:
  checkpoint: outputs/nef_fsq_soma_packed_40x9_ah/best.pt
  freeze: true
data:
  fsq_window_index: data/processed/seed_soma_pruned_v4_ah
  required_data_schema_version: 4
  token_store: data/processed/seed_soma_pruned_v4_ah_tokens
  frames: 64
  dataset: seed
  content:
    kind: action_id
transport:
  dim: 256
  token_embed_dim: 16
  position_encoding: sinusoidal
  depth: 8
  heads: 8
  dropout: 0.1
  graph_mode: local_relational
  graph_depth: 2
  temporal_mode: bidirectional
  content_dim: null
  content_classes: null
masking:
  random_coordinate: 0.2
  stream: 0.25
  temporal_span: 0.2
  spatiotemporal_block: 0.2
  full_generation: 0.15
  coordinate_ratio: 0.3
  block_frames: 8
  block_coordinates: 8
  span_ratio: 0.25
evaluation:
  protocol_id: mts-transport-revision2-full-v1
  validation_kinds:
  - random_coordinate
  - stream
  - temporal_span
  - spatiotemporal_block
  - full_generation
  validation_rows_per_kind: 64
training:
  epochs: 10
  lr: 0.0003
  weight_decay: 0.0
  grad_clip_norm: 1.0
  precision: fp32
  seed: 3407
  log_every_steps: 100
  steps_per_epoch: 200
  max_steps: 2000
  output_dir: outputs/mts_revision2/mts_transport
sampling:
  strategy: clip_uniform
  target_frames: 64
  samples_per_epoch: 100000
  seed: 3407
loader:
  batch_size: 128
  num_workers: 0
  return_metadata: false
