# NEF-FSQ v1.1 physical ablation: identical representation, staged objective.
#
# The canonical 40x9 / 13-stream contract is untouched: `representation`,
# `data`, `sampling` and `loader` are the same as nef_fsq_40x9.yaml so the two
# checkpoints stay comparable token-for-token.  Only the training objective
# changes: the first `physical_warmup_epochs` epochs are exactly v1's
# L_recon + 3 * L_delta, then the physical terms ramp in linearly over
# `physical_ramp_epochs` epochs.
#
# Keep v1 (outputs/nef_fsq_40x9) as the baseline checkpoint.  A v1.1 model may
# only replace it if FK/foot metrics improve *without* measurably hurting token
# locality or level usage (plan §4.2); otherwise it stays an ablation.
representation:
  family: nef_fsq
  variant: independent
  config:
    motion_dim: 230
    stream_dim: 128
    num_levels: 9
    activation: relu
    norm:
    fsq_scale:
    fsq_preserve_symmetry: false
    fsq_noise_dropout: 0.0

data:
  fsq_window_index: data/processed/100style_pruned_90/fsq_window_index
  required_data_schema_version: 3

sampling:
  strategy: clip_uniform
  target_frames: 64
  samples_per_epoch: 100000
  seed: 3407
  mirror_probability: 0.5

training:
  epochs: 100
  lr: 0.0005
  weight_decay: 0.0
  precision: fp32
  seed: 3407
  deterministic: false
  grad_clip_norm: 1.0
  output_dir: outputs/nef_fsq_40x9_physical
  objective_variant: recon_delta_physical_warmup
  # Epochs 1..10 are the v1 objective; epochs 11..30 ramp the terms below.
  physical_warmup_epochs: 10
  physical_ramp_epochs: 20
  delta_weight: 3.0
  root_pos_weight: 0.05
  root_rot_weight: 0.05
  joint_weight: 0.10
  contact_weight: 0.03
  foot_slide_weight: 0.05
  foot_height_weight: 0.02
  reuse_weight: 0.0
  base_reuse_weight: 0.0
  latent_energy_weight: 0.0
  base_recon_weight: 0.0
  edit_weight: 0.0
  edit_preserve_weight: 0.0

evaluation:
  metrics_interval: 100
  root_dt: 0.016666666666666666

loader:
  batch_size: 512
  num_workers: 4
  pin_memory: auto
  persistent_workers: true
  prefetch_factor: 2
  drop_last_train: true
  max_open_shards: 32
  prefetch_memory_limit_mb: 512
