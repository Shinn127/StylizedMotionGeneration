# NEF-FSQ (Node-Edge Factorized FSQ) on the pruned BONES-SEED SOMA skeleton (27 joints / 248D).
# SOMA trains its own checkpoint and token store: the joint names, parent graph,
# feature ownership and schema differ from Geno, so tokens are not interchangeable.
representation:
  family: nef_fsq
  variant: independent
  config:
    motion_dim: 248
    stream_dim: 128
    num_levels: 9
    activation: relu
    norm:
    fsq_scale:
    fsq_preserve_symmetry: false
    fsq_noise_dropout: 0.0

data:
  fsq_window_index: data/processed/soma_pruned/fsq_window_index
  required_data_schema_version: 3

sampling:
  strategy: clip_uniform
  target_frames: 64
  samples_per_epoch: 100000
  seed: 3407
  mirror_probability: 0.5

training:
  epochs: 100
  lr: 0.0005
  weight_decay: 0.0
  precision: fp32
  seed: 3407
  deterministic: false
  grad_clip_norm: 1.0
  output_dir: outputs/nef_fsq_soma_40x9
  # Same objective contract as the Geno run: L = L_recon + 3.0 * L_delta.
  delta_weight: 3.0
  root_pos_weight: 0.0
  root_rot_weight: 0.0
  joint_weight: 0.0
  contact_weight: 0.0
  foot_slide_weight: 0.0
  foot_height_weight: 0.0
  reuse_weight: 0.0
  base_reuse_weight: 0.0
  latent_energy_weight: 0.0
  base_recon_weight: 0.0
  edit_weight: 0.0
  edit_preserve_weight: 0.0

evaluation:
  metrics_interval: 100
  root_dt: 0.016666666666666666

loader:
  batch_size: 512
  num_workers: 4
  pin_memory: auto
  persistent_workers: true
  prefetch_factor: 2
  drop_last_train: true
  max_open_shards: 32
  prefetch_memory_limit_mb: 512
