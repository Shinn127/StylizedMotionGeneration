feature_database: data/processed/100style_pruned/feature_database
split_train: train
split_val: val

batch_size: 512
epochs: 100
lr: 0.0002
min_lr: 0.00001
warmup_epochs: 2
seed: 3407
deterministic: false
grad_clip_norm: 1.0

num_workers: 8
prefetch_factor: 4
pin_memory: true
persistent_workers: true

precision: fp32
base_code_dim: 128
base_width: 512
part_state_dim: 64
residual_decoder_dim: 128
residual_decoder_width: 128
residual_hidden_dim: 64
residual_group_dropout: 0.1

fsq_num_levels: 9
fsq_scale:
fsq_preserve_symmetry: false
fsq_noise_dropout: 0.0
metrics_interval: 100

base_loss_weight: 0.25
base_reuse_weight: 0.0025
base_reuse_threshold: 1.0
contact_transition_threshold: 0.25

delta_weight: 3.0
root_pos_weight: 0.1
root_rot_weight: 0.1
joint_weight: 0.5
contact_weight: 0.1
foot_slide_weight: 0.1
foot_height_weight: 0.1
contact_temperature: 10.0
root_dt: 0.016666666666666666

outdir: outputs/residual_part_fsq_pruned_40x9
run_name: residual_part_fsq_pruned_40x9
resume:
save_every: 0
log_every: 100
data_parallel: false
